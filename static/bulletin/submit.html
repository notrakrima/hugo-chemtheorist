<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit to Bulletin</title>
</head>
<body>
    <h1>Submit to the Lab Initio Bulletin</h1>
    <p>Please fill out the form below to submit your item.</p>

    <form name="bulletin-submission" method="POST" data-netlify="true" action="/bulletin/success/">
        <p>
            <label>Your Name: <input type="text" name="name" required /></label>
        </p>
        <p>
            <label>Your Email: <input type="email" name="email" required /></label>
        </p>
        <p>
            <label>Title: <input type="text" name="title" required /></label>
        </p>
        <p>
            <label>Content (Markdown is okay): <textarea name="content" required></textarea></label>
        </p>
        <p>
            <button type="submit">Submit</button>
        </p>
    </form>

</body>
</html>
