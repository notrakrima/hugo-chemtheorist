<div class="scholar-metrics">
  {{ $data := .Site.Data.scholar }}
  {{ if $data }}
    <ul style="list-style-type: none; padding: 0;">
      <li><strong>Citations:</strong> {{ $data.citations }}</li>
      <li><strong>h-index:</strong> {{ $data.h_index }}</li>
      <li><strong>i10-index:</strong> {{ $data.i10_index }}</li>
    </ul>
    <p style="font-size: 0.9em; color: #666;">(Source: <a href="https://scholar.google.com.au/citations?user=ogleADAAAAAJ&hl=en" target="_blank">Google Scholar</a>; Updated: {{ $data.last_updated }})</p>
  {{ else }}
    <p><em>Scholar metrics currently unavailable.</em></p>
  {{ end }}
</div>
