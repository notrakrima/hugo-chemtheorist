{{ $parts := split .Inner "<!--SPLIT-->" }}
{{ $left_content := index $parts 0 | markdownify }}
{{ $right_content := index $parts 1 | markdownify }}

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2rem; margin-bottom: 2rem;">
  
  <div class="contact-page-image-column" style="flex: 1; min-width: 200px; max-width: 400px;">
    {{ $left_content }}
  </div>

  <div style="flex: 2; min-width: 300px; overflow-wrap: break-word;">
    {{ $right_content }}
  </div>

</div>
